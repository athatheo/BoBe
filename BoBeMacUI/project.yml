name: BoBe
options:
  bundleIdPrefix: com.bobe
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: none

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.5.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ENABLE_PREVIEWS: YES
    # Concurrency
    SWIFT_STRICT_CONCURRENCY: complete
    # Warnings
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Signing (override per-machine via xcconfig or Xcode UI)
    CODE_SIGN_STYLE: Automatic
    # Dead code
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      DEBUG_INFORMATION_FORMAT: "dwarf"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_TESTABILITY: NO

targets:
  BoBe:
    type: application
    platform: macOS
    sources:
      - path: BoBe
        excludes:
          - Resources/Info.plist
          - Resources/BoBe.entitlements
    resources:
      - path: BoBe/Resources
        excludes:
          - Info.plist
          - BoBe.entitlements
    dependencies:
      - package: Sparkle
      - package: Textual
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobe.app
        PRODUCT_NAME: BoBe
        INFOPLIST_FILE: BoBe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: entitlements.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi
  BoBeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BoBeUITests
    dependencies:
      - target: BoBe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobe.app.uitests
        TEST_TARGET_NAME: BoBe
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BoBe:
    build:
      targets:
        BoBe: all
        BoBeUITests: [test]
    test:
      targets:
        - BoBeUITests
