# cargo-audit configuration.
#
# Suppress known-but-unreachable advisories with documented reasoning.
# Each entry must name the advisory, the dependency path, and the
# justification for treating it as non-blocking.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — RSA Marvin timing side-channel.
    #
    # Pulled in via sqlx-macros → sqlx-mysql → rsa, even though our
    # sqlx config sets `default-features = false` with only `sqlite`
    # enabled. sqlx-macros (the FromRow derive) declares all three
    # backends as build dependencies so the offline `query!` macro can
    # introspect their schemas — this is a sqlx packaging artifact,
    # not a runtime concern.
    #
    # The vulnerable RSA decryption path is the MySQL TLS handshake.
    # Our daemon never connects to MySQL — `cargo tree --invert -p rsa`
    # returns "nothing to print" because rsa is in Cargo.lock as a
    # potential dep but not in the resolved runtime graph. No upstream
    # fix is available (rsa crate maintainer has open issue tracking).
    #
    # If sqlx 0.9 ships a packaging fix, remove this ignore.
    "RUSTSEC-2023-0071",
]
