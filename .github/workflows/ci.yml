name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      swift: ${{ steps.check.outputs.swift }}
      workflows: ${{ steps.check.outputs.workflows }}
    steps:
      - name: Check changed paths
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # On push to main, run everything; on PRs, filter by changed paths
          if [ "$EVENT_NAME" = "push" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          echo "rust=false" >> "$GITHUB_OUTPUT"
          echo "swift=false" >> "$GITHUB_OUTPUT"
          echo "workflows=false" >> "$GITHUB_OUTPUT"
          if echo "$FILES" | grep -qE '^(BoBeService/|\.github/workflows/|justfile$|scripts/|Cargo\.lock$|BoBeService/Cargo\.lock$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^(BoBeMacUI/|\.github/workflows/|justfile$|scripts/|Package\.resolved$|BoBeMacUI/Package\.resolved$)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^(\.github/workflows/|justfile$|scripts/|Cargo\.lock$|Package\.resolved$|BoBeService/Cargo\.lock$|BoBeMacUI/Package\.resolved$)'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          fi

  rust-checks:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            BoBeService/target/
          key: v1-cargo-${{ runner.os }}-${{ hashFiles('BoBeService/Cargo.lock') }}
          restore-keys: v1-cargo-${{ runner.os }}-

      - name: Cache CI tool binaries
        id: tool-cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cargo/bin/
          key: ci-tools-${{ runner.os }}-deny0.19.0-machete0.9.1

      - name: Install CI tools
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-deny --version 0.19.0
          cargo install --locked cargo-machete --version 0.9.1

      - name: Check formatting
        run: cd BoBeService && cargo fmt --check

      - name: Clippy
        run: cd BoBeService && cargo clippy --locked -q

      - name: Tests
        env:
          CARGO_INCREMENTAL: "0"
        run: cd BoBeService && cargo test --locked -q

      - name: Supply-chain audit
        run: cd BoBeService && cargo deny check

      - name: Unused dependencies
        run: cd BoBeService && cargo machete

  rust-linux:
    name: Rust locked checks (Ubuntu)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libssl-dev libsqlite3-dev pkg-config

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            BoBeService/target/
          key: v1-cargo-${{ runner.os }}-stable-${{ hashFiles('BoBeService/Cargo.lock') }}
          restore-keys: v1-cargo-${{ runner.os }}-stable-

      - name: Cargo check
        run: cd BoBeService && cargo check --locked

      - name: Cargo build
        run: cd BoBeService && cargo build --locked

      - name: Cargo test
        env:
          CARGO_INCREMENTAL: "0"
        run: cd BoBeService && cargo test --locked

  rust-msrv:
    name: Rust 1.94 MSRV check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libssl-dev libsqlite3-dev pkg-config

      - name: Set up Rust 1.94
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: "1.94.0"

      - name: Check with the minimum supported Rust version
        run: cd BoBeService && cargo check --locked

  workflow-validation:
    name: Workflow and shell syntax
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| Psych.parse_file(path) }' \
            .github/workflows/*.yml

      - name: Validate repository shell script syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0 2>/dev/null)

  swift-checks:
    name: Swift checks
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Swift packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: BoBeMacUI/.build
          key: v1-spm-${{ runner.os }}-${{ hashFiles('BoBeMacUI/Package.resolved') }}
          restore-keys: v1-spm-${{ runner.os }}-

      - name: Install SwiftLint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew list swiftlint &>/dev/null || brew install swiftlint
          swiftlint version

      - name: Lint Swift
        run: cd BoBeMacUI && swiftlint lint --quiet

      - name: Build Swift
        run: cd BoBeMacUI && swift build -c debug
